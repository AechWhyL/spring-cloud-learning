services:
  seata-server:
    image: seataio/seata-server:1.5.2
    env_file:
      - ./env/.env
    hostname: seata-server
    networks:
      - seata-network
      - nacos-network
    environment:
      - STORE_MODE=db
      - SEATA_PORT=8091
      - SEATA_IP=198.2.161.1
    volumes:
      - "./seata-server-1.5.2-resources/application.yml:/seata-server/resources/application.yml"
    depends_on:
      mysql-for-seata:
        condition: service_healthy

  mysql-for-seata:
    image: mysql:5.7.44
    env_file:
      - ./env/mysql.env
    container_name: mysql-for-seata
    networks:
      - seata-network
    ports:
      - "127.0.0.1:3386:3306"
    volumes:
      - mysql-for-seata:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  nacos-network:
    external: true
    name: my-nacos_nacos-network
  seata-network:
    driver: bridge

volumes:
  mysql-for-seata:
